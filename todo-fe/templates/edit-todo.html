{% include 'layout.html' %}

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">Edit Todo</h5>
    </div>
    <div class="card-body">
      <form id="editTodoForm">
        <div class="form-group mb-3">
          <label>Title</label>
          <input type="text" class="form-control" name="title" value="{{ todo.title }}" required>
        </div>

        <div class="form-group mb-3">
          <label>Description</label>
          <textarea class="form-control" rows="3" name="description" required>{{ todo.description }}</textarea>
        </div>

        <div class="form-group mb-3">
          <label>Priority</label>
          <select class="form-control" name="priority" required>
            {% for p in range(1, 6) %}
            <option {% if todo.priority == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group form-check mb-3">
          <input type="checkbox" class="form-check-input" name="complete" {% if todo.complete %}checked{% endif %}>
          <label class="form-check-label">Complete</label>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button id="deleteButton" type="button" class="btn btn-danger">Delete</button>
          <a href="todos/todo-page" class="btn btn-success">Back</a>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- JS -->
<script src="/static/js/base.js"></script>
<script src="/static/js/todos.js"></script>
